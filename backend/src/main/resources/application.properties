# =========================
# PostgreSQL
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/projeto_integrador
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
# Durante o desenvolvimento é melhor usar "update" para o Hibernate
# criar/ajustar as tabelas conforme as entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Executa o schema.sql na inicialização (se você estiver usando esse script)
spring.sql.init.mode=always

# =========================
# Server / Logging
# =========================
server.port=8080
logging.level.br.pucgo.ads.projetointegrador=DEBUG
logging.level.org.springframework.web=DEBUG

# =========================
# JWT (usa JwtProperties)
# =========================
security.jwt.secret=CHANGEME-SUPER-SECRET-KEY-32-CHARS-MIN
security.jwt.issuer=pi-eldercare
# Por enquanto essa propriedade não é usada pelo JwtProperties, mas pode ficar
security.jwt.expiration=3600000
